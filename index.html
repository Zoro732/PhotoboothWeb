<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <script src="script.js"></script>
</head>
<body>
    <!-- <div id ="cursor"></div>
    <div id ="cursor2"></div> -->
    <div id="highlandbar">
        <div id="selector"></div>
        <div id="mainPageBtn">
            <img src="assets/camera.svg">
            <p>Accueil</p>
        </div>
        <div id="galleryBtn" class="selectorBtn">
            <img src="assets/image.svg">
            <p>Galerie</p>
        </div>
    </div>
    <div id="main">
        <div id="backgroundWrapper">
            <img src="assets/mainpage.jpg" alt="Background" id="background">
        </div>
        <h1 id="titleText">Marion<br>&amp;Charles</h1>
        <button id="openStreamBtn">
            <img src="assets/camera.svg" alt="Ouvrir le stream">
        </button>
        <p id="instructionText">Appuyer pour prendre une photo</p>
        <div id="streamContainer" style="display:none;">
            <button id="closeStreamBtn">
                <img src="assets/x.svg" alt="Fermer">
            </button>
            <div id="streamWrapper">
                <img src="http://192.168.1.22:8080/stream" id="stream" crossorigin="anonymous">
                <div id="flashOverlay"></div>
                <canvas id="captureCanvas" style="display:none;"></canvas>
                <div id="photoThumbnail"></div>
            </div>
        
            <p id="status"></p>
        </div>
        
        <button id="shootBtn">
            <img src="assets/take_picture.svg" alt="Prendre une photo">
        </button>
        <div id="photoActions">
            <button id="rejectPhotoBtn">
                <img src="assets/x.svg" alt="Refuser">
            </button>
            <button id="acceptPhotoBtn">
                <img src="assets/check.svg" alt="Valider">
            </button>
        </div>

        <img src="assets/logo_white.png" alt="Logo" id="logo">
    </div>

    <div id="gallery">
        <div id="galleryGrid"></div>
    </div>
    

    
</body>
</html>
