<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Photobooth</title>
    <link rel="stylesheet" href="index.css">
    <script src="script.js"></script>
    <link rel="icon" href="assets/logo_white.png" />
</head>

<body>
    <div id="highlandbar">
        <div id="selector"></div>
        <div id="mainPageBtn">
            <img src="assets/camera.svg">
            <p>Accueil</p>
        </div>
        <div id="galleryBtn" class="selectorBtn">
            <img src="assets/image.svg">
            <p>Galerie</p>
        </div>
    </div>
    <div id="main">
        <div id="backgroundWrapper">
            <img src="assets/mainpage.jpg" alt="Background" id="background">
        </div>
        <h1 id="titleText">Marion<br>&amp;Charles</h1>
        <button id="openStreamBtn">
            <img src="assets/camera.svg" alt="Ouvrir le stream">
        </button>
        <p id="instructionText">Appuyer pour prendre une photo</p>
        <div id="streamContainer" style="display:none;">
            <button id="closeStreamBtn">
                <img src="assets/x.svg" alt="Fermer">
            </button>
            <div id="streamWrapper">
                <img src="http://192.168.1.20:8080/stream" id="stream" crossorigin="anonymous">
                <div id="flashOverlay"></div>
                <div id="countdownOverlay"></div>
                <canvas id="captureCanvas" style="display:none;"></canvas>
                <div id="photoThumbnail"></div>
            </div>
        </div>

        <button id="shootBtn">
            <svg id="shootsvg" xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 24 24">
                <!-- Cercle extérieur -->
                <circle cx="12" cy="12" r="10" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
                <!-- Cercle intérieur rempli (rayon 8) -->
                <circle cx="12" cy="12" r="8" fill="white" />
            </svg>
        </button>
        <div id="photoActions">
            <button id="rejectPhotoBtn">
                <img src="assets/x.svg" alt="Refuser">
            </button>
            <button id="acceptPhotoBtn">
                <img src="assets/check.svg" alt="Valider">
            </button>
        </div>
        <img src="assets/logo_white.png" alt="Logo" id="logo">
    </div>

    <div id="gallery">
        <div id="galleryGrid"></div>
    </div>

    <!-- Overlay lightbox pour agrandir une photo de la galerie -->
    <div id="lightboxOverlay" style="display:none;">
        <button id="lightboxClose" aria-label="Fermer la photo">
            <img src="assets/x.svg" alt="Fermer">
        </button>
        <button id="lightboxPrint" aria-label="Imprimer la photo">
            <img src="assets/printer.svg" alt="Imprimer">
        </button>
        <div id="printQuantityPanel" style="display:none;">
            <div id="printValidateWrapper">
                <button id="printValidate" aria-label="Valider l'impression">
                    <img src="assets/check.svg" alt="Valider">
                </button>
            </div>
            <div id="printQuantityControls">
                <button id="printIncrement" aria-label="Augmenter la quantité">
                    <span>+</span>
                </button>
                <div id="printQuantityDisplay">1</div>
                <button id="printDecrement" aria-label="Diminuer la quantité">
                    <span>−</span>
                </button>
            </div>
        </div>
    
    <button id="template_mode">
        <img src="assets/sparkles.svg">
    </button>

    <img src="assets/templates/1.png" id="template1" alt="" style="display:none;">
    <img src="assets/templates/2.png" id="template2" alt="" style="display:none;">
    <img src="assets/templates/3.png" id="template3" alt="" style="display:none;">
    
     <div id="template_selection" style="display:none;">
        <button class="template_option">
            <span>1</span>    
        </button>
        <button class="template_option">
            <span>2</span>    
        </button>
        <button class="template_option">
            <span>3</span>    
        </button>
    </div>  
</div>

    <!-- Notification d'impression -->
    <div id="printNotification"></div>

</body>

</html>
