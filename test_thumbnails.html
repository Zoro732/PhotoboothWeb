<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Thumbnails</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #232323;
            color: white;
        }
        .test-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        .test-item {
            border: 2px solid #444;
            padding: 10px;
            border-radius: 8px;
            background: #353535;
        }
        .test-item h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
        }
        .test-item img {
            display: block;
            max-width: 300px;
            border: 1px solid #666;
        }
        .error {
            color: #ff6b6b;
            font-weight: bold;
        }
        .success {
            color: #51cf66;
            font-weight: bold;
        }
        .info {
            color: #74c0fc;
            margin-top: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>Test de Génération de Thumbnails</h1>
    <p>Cette page teste si thumbnail.php fonctionne correctement.</p>
    
    <div id="status">Chargement des photos...</div>
    <div class="test-container" id="results"></div>

    <script>
        async function testThumbnails() {
            const statusDiv = document.getElementById('status');
            const resultsDiv = document.getElementById('results');
            
            try {
                // Récupérer la liste des photos
                const res = await fetch('./get_photo.php');
                const photos = await res.json();
                
                statusDiv.innerHTML = `<span class="success">✓ ${photos.length} photos trouvées</span>`;
                
                if (photos.length === 0) {
                    statusDiv.innerHTML = '<span class="error">✗ Aucune photo dans le dossier photos/</span>';
                    return;
                }
                
                // Tester les 5 premières photos
                const testPhotos = photos.slice(0, 5);
                
                for (const photo of testPhotos) {
                    const item = document.createElement('div');
                    item.className = 'test-item';
                    
                    const title = document.createElement('h3');
                    title.textContent = photo;
                    item.appendChild(title);
                    
                    // Test 1: Image originale
                    const originalUrl = `./photos/${photo}`;
                    const originalImg = document.createElement('img');
                    originalImg.src = originalUrl;
                    originalImg.onerror = () => {
                        const error = document.createElement('div');
                        error.className = 'error';
                        error.textContent = '✗ Image originale non trouvée';
                        item.appendChild(error);
                    };
                    originalImg.onload = () => {
                        const info = document.createElement('div');
                        info.className = 'info';
                        info.textContent = `✓ Original: ${originalImg.naturalWidth}x${originalImg.naturalHeight}px`;
                        item.appendChild(info);
                    };
                    
                    const originalLabel = document.createElement('div');
                    originalLabel.textContent = 'Image originale:';
                    originalLabel.style.marginTop = '10px';
                    item.appendChild(originalLabel);
                    item.appendChild(originalImg);
                    
                    // Test 2: Thumbnail
                    const thumbUrl = `./thumbnail.php?file=${encodeURIComponent(photo)}&w=480`;
                    const thumbImg = document.createElement('img');
                    thumbImg.src = thumbUrl;
                    thumbImg.onerror = async () => {
                        const error = document.createElement('div');
                        error.className = 'error';
                        
                        // Essayer de récupérer le message d'erreur
                        try {
                            const errRes = await fetch(thumbUrl);
                            const errText = await errRes.text();
                            error.textContent = `✗ Erreur thumbnail: ${errText}`;
                        } catch {
                            error.textContent = '✗ Thumbnail non généré (erreur serveur)';
                        }
                        item.appendChild(error);
                    };
                    thumbImg.onload = () => {
                        const info = document.createElement('div');
                        info.className = 'success';
                        info.textContent = `✓ Thumbnail: ${thumbImg.naturalWidth}x${thumbImg.naturalHeight}px`;
                        item.appendChild(info);
                    };
                    
                    const thumbLabel = document.createElement('div');
                    thumbLabel.textContent = 'Thumbnail (480px):';
                    thumbLabel.style.marginTop = '10px';
                    item.appendChild(thumbLabel);
                    item.appendChild(thumbImg);
                    
                    resultsDiv.appendChild(item);
                }
                
            } catch (err) {
                statusDiv.innerHTML = `<span class="error">✗ Erreur: ${err.message}</span>`;
                console.error('Erreur:', err);
            }
        }
        
        testThumbnails();
    </script>
</body>
</html>
